<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-in Spinning · América Greco</title>
<meta name="description" content="Reserve sua bike na aula de spinning da América Greco.">
<meta name="theme-color" content="#2C1F14">
<link rel="icon" href="https://americagreco.com.br/favicon.png">
<link rel="apple-touch-icon" href="https://americagreco.com.br/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="simple">

<header class="sbar">
  <a href="https://americagreco.com.br" aria-label="América Greco"><img src="https://americagreco.com.br/assets/logo-FvL6IWpH.webp" alt="América Greco"></a>
  <span>Check-in Spinning</span>
</header>

<main class="wrap">
  <form class="card" id="form" novalidate>
    <div class="card-head">
      <div><div class="eyebrow">Greco Cycle</div><h3>Reserve sua bike</h3></div>
      <span class="live"><i></i>Ao vivo</span>
    </div>

    <div class="block">
      <div class="step-label"><span>01</span>Aula</div>
      <div class="aulas" id="aulas"><div class="empty">Carregando aulas…</div></div>
    </div>

    <div class="block">
      <div class="step-label"><span>02</span>Você é</div>
      <div class="tipos" id="tipos">
        <button type="button" class="tipo" data-t="aluno" disabled>
          <span class="t-top"><strong>Aluno da academia</strong><em>Incluso no plano</em></span>
          <span class="t-vagas" id="vAluno">—</span>
        </button>
        <button type="button" class="tipo" data-t="externo" disabled>
          <span class="t-top"><strong>Externo · diária</strong><em id="vPreco">—</em></span>
          <span class="t-vagas" id="vExterno">—</span>
        </button>
      </div>
    </div>

    <div class="block">
      <div class="step-label"><span>03</span>Seus dados</div>
      <div class="fields">
        <div class="field full"><input id="nome" autocomplete="name" placeholder=" " maxlength="120" required><label for="nome">Nome completo</label></div>
        <div class="field"><input id="cpf" inputmode="numeric" autocomplete="off" placeholder=" " maxlength="14" required><label for="cpf">CPF</label></div>
        <div class="field"><input id="tel" inputmode="tel" autocomplete="tel" placeholder=" " maxlength="15"><label for="tel">WhatsApp</label></div>
      </div>
    </div>

    <div class="summary">
      <div class="sel" id="sel">Escolha a aula para continuar</div>
      <button class="btn btn-dark" id="go" type="submit" disabled>Confirmar check-in</button>
    </div>
    <div class="msg" id="msg"></div>
  </form>

  <details class="cancel" id="consulta">
    <summary>Já reservou? Consultar ou cancelar</summary>
    <form class="lookup-form" id="lookup">
      <input id="cpf2" inputmode="numeric" placeholder="Seu CPF" maxlength="14" aria-label="CPF">
      <button class="btn btn-dark" type="submit">Consultar</button>
    </form>
    <div class="mine" id="mine"></div>
  </details>

  <p class="foot-s">Chegue 5 min antes para ajustar a bike · <a href="/admin">Gestão</a></p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="tkTitle">
  <div class="ticket" id="ticket">
    <div class="ticket-top">
      <img src="https://americagreco.com.br/assets/logo-FvL6IWpH.webp" alt="">
      <div class="eyebrow">Check-in confirmado</div>
      <h3 id="tkTitle">Bike garantida, <span id="tkNome"></span>.</h3>
    </div>
    <div class="ticket-cut"><i></i></div>
    <div class="ticket-body">
      <div class="ticket-row">
        <div><small>Dia</small><strong id="tkDia"></strong></div>
        <div><small>Horário</small><strong id="tkHora"></strong></div>
      </div>
      <div class="code" id="tkCode"></div>
      <div class="pay" id="tkPay"></div>
      <p class="note" id="tkNote"></p>
      <button class="btn btn-dark" id="tkClose" type="button">Fechar</button>
    </div>
  </div>
</div>

<script src="/assets/config.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
