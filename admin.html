<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Spinning · América Greco</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2C1F14">
<link rel="icon" href="https://americagreco.com.br/favicon.png">
<link rel="apple-touch-icon" href="https://americagreco.com.br/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<!-- LOGIN -->
<main class="login" id="login">
  <form class="box" id="loginForm">
    <div class="logo"><img src="https://americagreco.com.br/assets/logo-FvL6IWpH.webp" alt="América Greco"></div>
    <h1>Painel do Spinning</h1>
    <label>Usuário<input id="lUser" autocomplete="username" autocapitalize="none" required></label>
    <label>Senha<input id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Entrar</button>
    <p class="erro" id="loginErro"></p>
  </form>
</main>

<!-- PAINEL -->
<div id="app" hidden>
  <header class="topo">
    <div class="logo"><img src="https://americagreco.com.br/assets/logo-FvL6IWpH.webp" alt="América Greco"></div>
    <button class="link" id="sair">Sair</button>
  </header>

  <main class="conteudo">
    <p class="ola" id="ola"></p>

    <!-- cadastrar -->
    <form class="box" id="form">
      <h2 id="formTitulo">Cadastrar aula</h2>
      <div class="linha">
        <label>Dia<input type="date" id="fData" required></label>
        <label>Horário<input type="time" id="fHora" required></label>
      </div>
      <div class="linha">
        <label>Vagas para alunos<input type="number" id="fAlunos" min="0" max="12" inputmode="numeric" required></label>
        <label>Vagas para externos<input type="number" id="fExternos" min="0" max="12" inputmode="numeric" required></label>
      </div>
      <p class="total" id="fTotal"></p>
      <button class="btn" type="submit" id="fBotao">Cadastrar aula</button>
      <button class="link" type="button" id="fCancelar" hidden>Cancelar edição</button>
      <p class="erro" id="fErro"></p>
    </form>

    <!-- lista -->
    <div class="titulo-lista">
      <h2>Aulas cadastradas</h2>
      <span class="ao-vivo"><i></i>atualiza sozinho</span>
    </div>
    <div id="lista"><p class="vazio">Carregando…</p></div>

    <details class="passadas" id="passadas">
      <summary>Ver aulas que já passaram</summary>
      <div id="listaPassadas"></div>
    </details>

    <!-- divulgar -->
    <div class="box qr">
      <img src="/assets/qr-checkin.png" alt="QR Code do check-in">
      <div>
        <h2>Link para os alunos</h2>
        <p>americagreco-checkin.vercel.app</p>
        <a class="btn claro" href="/assets/qr-checkin.png" download="qrcode-spinning.png">Baixar QR Code</a>
        <a class="btn claro" href="/cartaz" target="_blank" rel="noopener">Cartaz para imprimir</a>
      </div>
    </div>
  </main>
</div>

<div class="aviso" id="aviso"></div>

<script src="/assets/config.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
